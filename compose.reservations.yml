# Installation locale de Reservations et Abonnements. Places et Tarifs restent a integrer.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans .env}
    volumes:
      - shared-data:/var/lib/postgresql/data
      - ./reservations-service/src/main/resources/db/reservations.sql:/docker-entrypoint-initdb.d/001_reservations.sql:ro
      - ./reservations-service/src/main/resources/db/003_reservation_workflow.sql:/docker-entrypoint-initdb.d/002_workflow.sql:ro
      - ./reservations-service/src/main/resources/db/auth/001_accounts.sql:/docker-entrypoint-initdb.d/003_accounts.sql:ro
      - ./reservations-service/src/main/resources/db/auth/002_sessions.sql:/docker-entrypoint-initdb.d/004_sessions.sql:ro
      - ./reservations-service/src/main/resources/db/004_booking_payment.sql:/docker-entrypoint-initdb.d/005_booking_payment.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [parking]
  reservations:
    build: ./reservations-service
    environment:
      SPRING_PROFILES_ACTIVE: auth,compose
      DB_URL: jdbc:postgresql://db:5432/parking
      DB_USER: parking
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans .env}
      PLACES_API_URL: ${PLACES_API_URL:-}
      PLACES_API_USER: ${PLACES_API_USER:-}
      PLACES_API_PASSWORD: ${PLACES_API_PASSWORD:-}
      TARIFFS_API_URL: ${TARIFFS_API_URL:-}
      TARIFFS_API_USER: ${TARIFFS_API_USER:-}
      TARIFFS_API_PASSWORD: ${TARIFFS_API_PASSWORD:-}
      PLACES_SYNC_ENABLED: ${PLACES_SYNC_ENABLED:-false}
      AUTH_PLACES_USER: ${AUTH_PLACES_USER:-}
      AUTH_PLACES_PASSWORD_HASH: ${AUTH_PLACES_PASSWORD_HASH:-}
      AUTH_TARIFFS_USER: ${AUTH_TARIFFS_USER:-}
      AUTH_TARIFFS_PASSWORD_HASH: ${AUTH_TARIFFS_PASSWORD_HASH:-}
      AUTH_SUBSCRIPTIONS_USER: ${AUTH_SUBSCRIPTIONS_USER:-}
      AUTH_SUBSCRIPTIONS_PASSWORD_HASH: ${AUTH_SUBSCRIPTIONS_PASSWORD_HASH:-}
    depends_on:
      db: {condition: service_healthy}
    networks: [parking]
  subscriptions:
    build: ./subscriptions-service
    environment:
      NODE_ENV: production
      PORT: 8082
      DB_URL: postgres://db:5432/parking
      DB_USER: parking
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans .env}
    depends_on:
      db: {condition: service_healthy}
    networks: [parking]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-8080}:8080"]
    depends_on: [reservations]
    read_only: true
    tmpfs: [/tmp]
    networks: [parking]
networks:
  parking:
volumes:
  shared-data:
