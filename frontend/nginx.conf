pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 16k;
    map $uri $login_limit_key { default ""; /api/auth/login $binary_remote_addr; }
    limit_req_zone $login_limit_key zone=login:1m rate=10r/m;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Cache-Control no-store always;
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        location ^~ /internal { return 404; }
        location ~ ^/api/places(?:/|$) {
            # Resolution a la requete : le frontend Reservations seul reste utilisable.
            resolver 127.0.0.11 valid=5s;
            resolver_timeout 3s;
            set $places_backend http://places:8082;
            proxy_pass $places_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-User-Id "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }
        location ^~ /api/tarifs/ {
            resolver 127.0.0.11 valid=5s;
            resolver_timeout 3s;
            set $tarifs_backend http://tarifs:8082;
            proxy_pass $tarifs_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-User-Id "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }
        location /api/ {
            proxy_pass http://reservations:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-User-Id "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
