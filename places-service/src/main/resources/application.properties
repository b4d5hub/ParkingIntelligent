spring.application.name=places-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/parking}
spring.datasource.username=${DB_USER:parking}
spring.datasource.password=${DB_PASSWORD:dev}


spring.jpa.hibernate.ddl-auto=validate
spring.flyway.table=flyway_places_history

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

places.internal.user=${PLACES_API_USER:}
places.internal.password=${PLACES_API_PASSWORD:}
places.auth.enabled=${PLACES_AUTH_ENABLED:true}
places.auth.url=${AUTH_API_URL:}
places.auth.user=${AUTH_PLACES_USER:}
places.auth.password=${AUTH_PLACES_PASSWORD:}