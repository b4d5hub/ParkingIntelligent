spring.application.name=places-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/parking}
spring.datasource.username=${DB_USER:parking}
spring.datasource.password=${DB_PASSWORD:dev}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.table=flyway_places_history

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0