spring.application.name=auth-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parking}
spring.datasource.username=${DB_USER:parking}
spring.datasource.password=${DB_PASSWORD:}

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

parking.auth.login-account-limit=10
parking.auth.login-address-limit=50

parking.auth.clients.gateway.username=${AUTH_GATEWAY_USER:}
parking.auth.clients.gateway.password-hash=${AUTH_GATEWAY_PASSWORD_HASH:}
parking.auth.clients.places.username=${AUTH_PLACES_USER:}
parking.auth.clients.places.password-hash=${AUTH_PLACES_PASSWORD_HASH:}
parking.auth.clients.tarifs.username=${AUTH_TARIFFS_USER:}
parking.auth.clients.tarifs.password-hash=${AUTH_TARIFFS_PASSWORD_HASH:}
parking.auth.clients.reservations.username=${AUTH_RESERVATIONS_USER:}
parking.auth.clients.reservations.password-hash=${AUTH_RESERVATIONS_PASSWORD_HASH:}
parking.auth.clients.abonnements.username=${AUTH_SUBSCRIPTIONS_USER:}
parking.auth.clients.abonnements.password-hash=${AUTH_SUBSCRIPTIONS_PASSWORD_HASH:}
