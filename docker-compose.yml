# ParkingIntelligent - Fichier Docker Compose principal
# Lance l'ensemble des services en une seule commande :
#   docker compose up --build
#
# Persistance des données de la base :
#   Le volume nommé "parking_db_data" garantit que la base de données et les comptes
#   utilisateurs persistent sur disque entre chaque redémarrage (même après docker compose down).
#   À l'initialisation, les comptes de test (ADMIN, CONDUCTEUR, AGENT) sont créés automatiquement.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: ${DB_PASSWORD:-parking-local-db-password}
    volumes:
      - parking_db_data:/var/lib/postgresql/data
      - ./reservations-service/src/main/resources/db/reservations.sql:/docker-entrypoint-initdb.d/001_reservations.sql:ro
      - ./reservations-service/src/main/resources/db/003_reservation_workflow.sql:/docker-entrypoint-initdb.d/002_workflow.sql:ro
      - ./reservations-service/src/main/resources/db/auth/001_accounts.sql:/docker-entrypoint-initdb.d/003_accounts.sql:ro
      - ./reservations-service/src/main/resources/db/auth/002_sessions.sql:/docker-entrypoint-initdb.d/004_sessions.sql:ro
      - ./reservations-service/src/main/resources/db/004_booking_payment.sql:/docker-entrypoint-initdb.d/005_booking_payment.sql:ro
      - ./tarifs-service/src/main/resources/db/tarifs.sql:/docker-entrypoint-initdb.d/006_tarifs.sql:ro
      - ./subscriptions-service/scripts/script001.sql:/docker-entrypoint-initdb.d/007_subscriptions.sql:ro
      - ./subscriptions-service/scripts/script002.sql:/docker-entrypoint-initdb.d/008_subscription_prices.sql:ro
      - ./subscriptions-service/scripts/script003.sql:/docker-entrypoint-initdb.d/009_subscription_seed.sql:ro
      - ./auth-service/src/main/resources/db/010_seed_accounts.sql:/docker-entrypoint-initdb.d/010_seed_accounts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - parking

  auth:
    build: ./auth-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://db:5432/parking
      DB_USER: parking
      DB_PASSWORD: ${DB_PASSWORD:-parking-local-db-password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parking

  reservations:
    build: ./reservations-service
    environment:
      SPRING_PROFILES_ACTIVE: auth,compose
      DB_URL: jdbc:postgresql://db:5432/parking
      DB_USER: parking
      DB_PASSWORD: ${DB_PASSWORD:-parking-local-db-password}
      PLACES_API_URL: ${PLACES_API_URL:-http://places:8082}
      PLACES_API_USER: ${PLACES_API_USER:-reservations-places-local}
      PLACES_API_PASSWORD: ${PLACES_API_PASSWORD:-local-places-api-2026}
      TARIFFS_API_URL: ${TARIFFS_API_URL:-http://tarifs:8082}
      TARIFFS_API_USER: ${TARIFFS_API_USER:-reservations-tarifs-local}
      TARIFFS_API_PASSWORD: ${TARIFFS_API_PASSWORD:-local-tarifs-api-2026}
      PLACES_SYNC_ENABLED: ${PLACES_SYNC_ENABLED:-true}
      AUTH_API_URL: ${AUTH_API_URL:-http://auth:8083}
      AUTH_RESERVATIONS_USER: ${AUTH_RESERVATIONS_USER:-reservations}
      AUTH_RESERVATIONS_PASSWORD: ${AUTH_RESERVATIONS_PASSWORD:-ReservationsAuthSecret2026_xyz}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    networks:
      - parking

  places:
    build: ./places-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/parking
      DB_USER: parking
      DB_PASSWORD: ${DB_PASSWORD:-parking-local-db-password}
      PLACES_API_USER: ${PLACES_API_USER:-reservations-places-local}
      PLACES_API_PASSWORD: ${PLACES_API_PASSWORD:-local-places-api-2026}
      AUTH_API_URL: ${AUTH_API_URL:-http://auth:8083}
      AUTH_PLACES_USER: ${AUTH_PLACES_USER:-places-auth-local}
      AUTH_PLACES_PASSWORD: ${AUTH_PLACES_PASSWORD:-local-places-auth-2026}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    networks:
      - parking

  tarifs:
    build: ./tarifs-service
    environment:
      PORT: '8082'
      DB_URL: jdbc:postgresql://db:5432/parking
      DB_USER: parking
      DB_PASSWORD: ${DB_PASSWORD:-parking-local-db-password}
      INTERNAL_CALLER_USER: ${TARIFFS_API_USER:-reservations-tarifs-local}
      INTERNAL_CALLER_SECRET: ${TARIFFS_API_PASSWORD:-local-tarifs-api-2026}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:8083}
      AUTH_TARIFS_USER: ${AUTH_TARIFFS_USER:-tarifs-auth-local}
      AUTH_TARIFS_SECRET: ${AUTH_TARIFS_SECRET:-local-tarifs-auth-2026}
      TARIFS_CURRENCY: ${TARIFS_CURRENCY:-MAD}
      SUBSCRIPTIONS_API_URL: ${SUBSCRIPTIONS_API_URL:-http://subscriptions:8082}
      SUBSCRIPTIONS_API_USER: ${SUBSCRIPTIONS_API_USER:-tarifs-subscriptions-local}
      SUBSCRIPTIONS_API_PASSWORD: ${SUBSCRIPTIONS_API_PASSWORD:-local-subscriptions-api-2026}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    networks:
      - parking

  subscriptions:
    build: ./subscriptions-service
    environment:
      NODE_ENV: production
      PORT: 8082
      DB_URL: postgres://db:5432/parking
      DB_USER: parking
      DB_PASSWORD: ${DB_PASSWORD:-parking-local-db-password}
      AUTH_API_URL: ${AUTH_API_URL:-http://auth:8083}
      AUTH_SUBSCRIPTIONS_USER: ${AUTH_SUBSCRIPTIONS_USER:-abonnements}
      AUTH_SUBSCRIPTIONS_PASSWORD: ${AUTH_SUBSCRIPTIONS_PASSWORD:-AbonnementsAuthSecret2026_uvw}
      SUBSCRIPTIONS_INTERNAL_USER: ${SUBSCRIPTIONS_API_USER:-tarifs-subscriptions-local}
      SUBSCRIPTIONS_INTERNAL_PASSWORD: ${SUBSCRIPTIONS_API_PASSWORD:-local-subscriptions-api-2026}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    networks:
      - parking

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - reservations
      - auth
      - places
      - tarifs
      - subscriptions
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - parking

networks:
  parking:

volumes:
  parking_db_data:
    name: parking_db_data
