# Ajoute le service Places au compose de Réservations (même base, même réseau).
# Utilisation : docker compose -f compose.reservations.yml -f compose.places.yml up --build
services:
  reservations:
    environment:
      PLACES_API_URL: http://places:8082
      PLACES_SYNC_ENABLED: 'true'
      AUTH_PLACES_USER: ${AUTH_PLACES_USER:-places-auth-local}
  places:
    build: ./places-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/parking
      DB_USER: parking
      DB_PASSWORD: ${DB_PASSWORD:-parking-local-db-password}
      PLACES_API_USER: ${PLACES_API_USER:-reservations-places-local}
      PLACES_API_PASSWORD: ${PLACES_API_PASSWORD:-local-places-api-2026}
      AUTH_API_URL: ${AUTH_API_URL:-http://auth:8083}
      AUTH_PLACES_USER: ${AUTH_PLACES_USER:-places-auth-local}
      AUTH_PLACES_PASSWORD: ${AUTH_PLACES_PASSWORD:-local-places-auth-2026}
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      db: {condition: service_healthy}
    networks: [parking]
