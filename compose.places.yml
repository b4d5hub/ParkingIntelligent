# Ajoute le service Places au compose de Réservations (même base, même réseau).
# Utilisation : docker compose -f compose.reservations.yml -f compose.places.yml up --build
services:
  places:
    build: ./places-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/parking
      DB_USER: parking
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans .env}
      PLACES_API_USER: ${PLACES_API_USER:?Definir PLACES_API_USER dans .env}
      PLACES_API_PASSWORD: ${PLACES_API_PASSWORD:?Definir PLACES_API_PASSWORD dans .env}
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      db: {condition: service_healthy}
    networks: [parking]