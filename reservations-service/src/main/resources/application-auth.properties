# Profil preparatoire : ne pas activer avant approbation du schema des comptes.
# Les sessions restent en memoire tant que JDBC n'est pas configure explicitement.
server.address=127.0.0.1
server.servlet.session.cookie.name=PARKING_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
