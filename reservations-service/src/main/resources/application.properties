spring.application.name=reservations-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parking}
spring.datasource.username=${DB_USER:parking}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
parking.places.url=${PLACES_API_URL:}
parking.places.user=${PLACES_API_USER:}
parking.places.password=${PLACES_API_PASSWORD:}
parking.tarifs.url=${TARIFFS_API_URL:}
parking.tarifs.user=${TARIFFS_API_USER:}
parking.tarifs.password=${TARIFFS_API_PASSWORD:}
parking.sync.enabled=${PLACES_SYNC_ENABLED:false}
parking.no-show-grace=${NO_SHOW_GRACE:}
