spring.application.name=tarifs-service
server.port=${PORT:8082}

# Configuration PostgreSQL alignée sur reservations-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parking}
spring.datasource.username=${DB_USER:parking}
spring.datasource.password=${DB_PASSWORD:}

# Validation stricte du schéma (aucun update automatique)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Paramètres métier
tarifs.currency=${TARIFS_CURRENCY:MAD}
