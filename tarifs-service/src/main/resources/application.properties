spring.application.name=tarifs-service
server.port=${PORT:8082}

# Configuration PostgreSQL alignée sur reservations-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parking}
spring.datasource.username=${DB_USER:parking}
spring.datasource.password=${DB_PASSWORD:}

# Validation stricte du schéma (aucun update automatique)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Paramètres métier
tarifs.currency=${TARIFS_CURRENCY:MAD}

# Compte machine Réservations → Tarifs (routes /internal/tarifs/**)
tarifs.internal.caller.user=${INTERNAL_CALLER_USER:}
tarifs.internal.caller.secret=${INTERNAL_CALLER_SECRET:}

# Compte machine Tarifs → Service auth Réservations (validate-user-request)
tarifs.auth.service.url=${AUTH_SERVICE_URL:}
tarifs.auth.tarifs.user=${AUTH_TARIFS_USER:}
tarifs.auth.tarifs.secret=${AUTH_TARIFS_SECRET:}
